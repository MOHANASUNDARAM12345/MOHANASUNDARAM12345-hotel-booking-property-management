# Test configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so automated tests run against a throwaway in-memory
# database instead of the developer's PostgreSQL instance.

spring.application.name=backend-test

# In-memory H2 database in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:stayrest_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Deterministic secrets for tests only.
jwt.secret=test-only-secret-key-that-is-long-enough-1234567890

app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-origin-patterns=https://*.vercel.app
